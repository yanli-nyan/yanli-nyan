name: Generate Snake Contribution Grid

on:
  schedule:
    # 每 4 小时跑一次，让贪吃蛇尽快跟上最新的贡献（UTC 0/4/8/12/16/20 点）
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# 同一时间只保留一个任务，避免并发推送 output 分支
concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0284C7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38BDF8

      - name: Push to output branch
        run: |
          sudo chown -R $USER:$USER dist
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Update snake animations"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output
