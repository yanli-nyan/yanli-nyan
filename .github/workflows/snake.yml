name: Generate Snake Contribution Grid

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0284C7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38BDF8

      - name: Push to output branch
        run: |
          # 修复 Docker 生成文件的 root 权限问题
          sudo chown -R $USER:$USER dist
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Update snake animations"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output